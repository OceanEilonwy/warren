[package]
name = "rabbitsim"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
maud = { version = "0.27.0", features = ["axum"] }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
tokio = { version = "1.54.1", features = ["full"] }
tower = "0.5.3"

[dev-dependencies]
http-body-util = "0.1.5"
tower = "0.5.3"
