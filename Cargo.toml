[workspace]
resolver = "3"
members = ["crates/core", "crates/server", "crates/wasm"]
# The WASM crate needs nightly and its own target; native `cargo build`/`cargo test` skip it.
default-members = ["crates/core", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rabbitsim = { path = "crates/core" }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release.package.rabbitsim-wasm]
opt-level = 3
